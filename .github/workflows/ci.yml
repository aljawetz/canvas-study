name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.28"
          enable-cache: true
      - name: Install Tesseract (OCR fallback)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: models
          key: bge-small-5c38ec7c
      - run: uv sync
      - name: The server's pinned versions match uv.lock
        run: ./scripts/export-constraints && git diff --exit-code plugin/server/constraints.txt
      - run: uv run pytest -q
      - name: The plugin's server builds and starts
        run: plugin/scripts/server --version
      - name: Without uv, the plugin downloads and verifies it, then starts
        # Empty home and a PATH without the uv that setup-uv installed: the
        # launcher must fetch uv itself, check its SHA-256 and run the server.
        run: env -i HOME="$(mktemp -d)" PATH=/usr/bin:/bin LANG=C.UTF-8 plugin/scripts/server --version

  # Python side on native Windows (#37): the tests, and the server starting
  # from the same constraints a student installs.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.28"
          enable-cache: true
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: models
          key: bge-small-5c38ec7c
      - name: Install Tesseract (OCR fallback)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: uv sync
      - run: uv run pytest -q -p no:cacheprovider
      - name: The plugin's server builds and starts
        shell: bash
        run: plugin/scripts/server --version
      - name: Without uv, the plugin downloads and verifies it, then starts
        # Git Bash with a PATH that has no uv: the launcher must fetch the
        # Windows build, check its SHA-256, unpack it and run the server.
        shell: bash
        run: |
          export PATH=/usr/bin:/bin:/c/Windows/System32:/c/Windows/System32/WindowsPowerShell/v1.0
          ! command -v uvx
          HOME="$(mktemp -d)" CLAUDE_PLUGIN_DATA="$(mktemp -d)" plugin/scripts/server --version

  # Experiment for #37: how Claude Code on native Windows starts a stdio MCP
  # server whose command is a POSIX sh script. `claude mcp list` health-checks
  # each server; nothing here needs a login.
  windows-claude-mcp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.28"
      - name: Install Claude Code
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          echo "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Register the server three ways and health-check them
        shell: pwsh
        continue-on-error: true
        run: |
          $script = "$env:GITHUB_WORKSPACE/plugin/scripts/server" -replace '\\', '/'
          claude --version
          claude mcp add --scope user direct -- "$script"
          claude mcp add --scope user viash -- sh "$script"
          claude mcp add --scope user viabash -- bash "$script"
          claude mcp list
          Get-Command sh, bash -ErrorAction SilentlyContinue | Format-Table Name, Source
      - name: Same, on a machine without Git for Windows
        shell: pwsh
        continue-on-error: true
        run: |
          $script = "$env:GITHUB_WORKSPACE/plugin/scripts/server" -replace '\\', '/'
          Rename-Item "C:\Program Files\Git" "Git-hidden"
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\' }) -join ';'
          Get-Command sh, bash, git -ErrorAction SilentlyContinue | Format-Table Name, Source
          claude mcp list
