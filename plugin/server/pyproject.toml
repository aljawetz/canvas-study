# The plugin's MCP server, run by uvx from this folder (plugin/scripts/server).
# The modules sit flat next to this file and import each other by name.
[project]
name = "canvas-study-mcp"
dynamic = ["version"]
description = "Canvas Study for Claude Code: search and deadlines from your own Canvas courses"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3",
    "httpx>=0.28",
    "keyring>=25.7",
    "llama-index-core>=0.12",
    "llama-index-vector-stores-lancedb>=0.3",
    "onnxruntime>=1.20",
    "pandas>=2.2",
    "tokenizers>=0.21",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pytesseract>=0.3",
]

[project.scripts]
canvas-study-mcp = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# <release>+<hash of this folder's code>: uvx reuses an env by name and
# version, so without the hash a code change would keep running the old build.
source = "code"
path = "version.py"

[tool.hatch.build.targets.wheel]
include = ["/*.py"]
exclude = ["/version.py"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "*.py" }]
